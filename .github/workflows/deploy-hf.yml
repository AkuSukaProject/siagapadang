name: Deploy Backend to Hugging Face Space

on:
  # Akan jalan otomatis kalau ada perubahan (push) di folder backend pada branch main
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  # Tombol manual untuk menjalankan workflow dari tab Actions
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Push backend folder to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "Cloning Hugging Face Space repository..."
          git clone https://shevaramadhan:$HF_TOKEN@huggingface.co/spaces/shevaramadhan/siagapadang hf-space
          
          echo "Clearing old files in Space..."
          cd hf-space
          # Hapus semua file kecuali folder .git agar history terjaga
          find . -maxdepth 1 ! -name '.git' ! -name '.' ! -name '..' -exec rm -rf {} +
          cd ..
          
          echo "Copying backend files to Space..."
          # Copy semua isi folder backend ke dalam folder hf-space
          cp -r backend/* hf-space/
          cp -a backend/. hf-space/ 2>/dev/null || true
          
          echo "Committing and Pushing to Hugging Face..."
          cd hf-space
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          
          git add .
          
          # Cek apakah ada perubahan
          if git diff --staged --quiet; then
            echo "No changes to deploy. Skipping push."
          else
            git commit -m "Deploy backend update via GitHub Actions"
            git push https://shevaramadhan:$HF_TOKEN@huggingface.co/spaces/shevaramadhan/siagapadang main
          fi
